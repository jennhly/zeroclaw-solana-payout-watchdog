[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-payout-watchdog"
version = "0.1.0"
description = "Read-only finalized Solana stablecoin payout monitor for ZeroClaw"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/jennhly/zeroclaw-solana-payout-watchdog"

[project.scripts]
solana-payout-watchdog = "payout_watchdog:main"

[tool.setuptools]
py-modules = ["payout_watchdog"]
